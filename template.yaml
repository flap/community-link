AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Community Link — beta deployment (FastAPI on Lambda + Mangum, HTTP API,
  DynamoDB single-table, private S3 media + SPA buckets, single CloudFront
  origin). Config read from SSM /community-link/beta/backend/* at cold start.

Parameters:
  Stage:
    Type: String
    Default: beta
    Description: Deployment stage name.
  ConfigSsmPath:
    Type: String
    Default: /community-link/beta/backend
    Description: SSM path prefix the Lambda loads into os.environ at cold start.
  ConfigVersion:
    Type: String
    Default: "0"
    Description: >
      Opaque value referenced in the Lambda env so bumping it (deploy --roll)
      forces CloudFormation to roll new containers that re-read SSM.
  CorsOrigins:
    Type: String
    Default: "*"
    Description: >
      Value for CL_CORS_ORIGINS. First deploy pass uses "*"; the deploy script
      passes https://<cloudfront-domain> on the second pass.
  MediaBaseUrl:
    Type: String
    Default: /media
    Description: Pins CL_MEDIA_BASE_URL for beta (media served via CloudFront /media/*).

Globals:
  Function:
    Timeout: 20
    MemorySize: 512
    Runtime: python3.12

Resources:

  # -- DynamoDB single-table (PK/SK only, PAY_PER_REQUEST, no GSI/LSI) --------
  CommunityTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: community-link
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # -- Private media bucket (served via CloudFront /media/*) -----------------
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # -- Private SPA bucket (Vite dist/, served via CloudFront default) --------
  SpaBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # -- HTTP API (explicit so it can be referenced by CloudFront + Outputs) ---
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default

  # -- FastAPI Lambda (Mangum) ----------------------------------------------
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.lambda_handler.handler
      CodeUri: backend/
      Environment:
        Variables:
          CONFIG_SSM_PATH: !Ref ConfigSsmPath
          MEDIA_BUCKET: !Ref MediaBucket
          CL_DYNAMODB_TABLE: !Ref CommunityTable
          CL_USE_IN_MEMORY_STORE: "false"
          CL_MEDIA_BASE_URL: !Ref MediaBaseUrl
          CL_CORS_ORIGINS: !Ref CorsOrigins
          CONFIG_VERSION: !Ref ConfigVersion
      Policies:
        - Statement:
            - Sid: SsmRead
              Effect: Allow
              Action:
                - ssm:GetParametersByPath
                - ssm:GetParameters
                - ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/community-link/beta/*
            - Sid: KmsDecryptForSsm
              Effect: Allow
              Action:
                - kms:Decrypt
              Resource:
                - !Sub arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/ssm
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
        - DynamoDBCrudPolicy:
            TableName: !Ref CommunityTable
        - Statement:
            - Sid: MediaBucketObjects
              Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource:
                - !Sub ${MediaBucket.Arn}/links/*
      Events:
        ProxyApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  # -- CloudFront Origin Access Control (OAC) for the private buckets --------
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub community-link-${Stage}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # -- CloudFront Functions (viewer-request) ---------------------------------
  SpaFallbackFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub community-link-${Stage}-spa-fallback
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite non-asset SPA deep links to /index.html (allowlist by extension).
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          var isAsset =
            uri.startsWith('/assets/') ||
            /\.(js|mjs|css|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|eot|map|json|txt|xml|webmanifest)$/i.test(uri);
          if (!isAsset) {
            request.uri = '/index.html';
          }
          return request;
        }

  StripMediaPrefixFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub community-link-${Stage}-strip-media-prefix
      AutoPublish: true
      FunctionConfig:
        Comment: Strip the /media prefix so CloudFront fetches the real object key.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          request.uri = request.uri.replace(/^\/media(\/|$)/, '/');
          return request;
        }

  # -- CloudFront distribution (single public origin) ------------------------
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub community-link-${Stage}
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        HttpVersion: http2
        Origins:
          - Id: spa-origin
            DomainName: !GetAtt SpaBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: media-origin
            DomainName: !GetAtt MediaBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api-origin
            DomainName: !Sub ${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: spa-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          # Managed CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaFallbackFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            # Managed CachingDisabled
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # Managed AllViewerExceptHostHeader
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: /media/*
            TargetOriginId: media-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            # Managed CachingOptimized
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt StripMediaPrefixFunction.FunctionMetadata.FunctionARN
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  # -- Bucket policies: only this distribution (OAC) may read objects --------
  SpaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SpaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadViaOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${SpaBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadViaOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${MediaBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

Outputs:
  HttpApiUrl:
    Description: API Gateway HTTP API invoke URL (direct).
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  CloudFrontDomain:
    Description: CloudFront distribution domain (public entry point).
    Value: !GetAtt Distribution.DomainName
  CloudFrontDistributionId:
    Description: CloudFront distribution ID (for invalidations).
    Value: !Ref Distribution
  MediaBucketName:
    Description: Private media bucket name.
    Value: !Ref MediaBucket
  FrontendBucketName:
    Description: Private SPA (frontend) bucket name.
    Value: !Ref SpaBucket
  TableName:
    Description: DynamoDB table name.
    Value: !Ref CommunityTable
